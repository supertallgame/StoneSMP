<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoneSMP | Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass-card { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-zinc-950/80 border-b border-zinc-800/60">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition">
        ← Back to Main
      </a>
      <span class="font-bold text-white text-base">StoneSMP Gallery</span>
    </div>
  </header>

  <!-- Gallery Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-12 flex-1 w-full">
    <div class="text-center mb-12">
      <h2 class="text-xs font-bold uppercase tracking-widest text-purple-400 mb-2">Visual Showcase</h2>
      <h3 class="text-3xl font-extrabold text-white">Community & Server Gallery</h3>
      <p class="text-xs sm:text-sm text-zinc-400 mt-2">Images uploaded by staff administrators appear here instantly.</p>
    </div>

    <!-- Gallery Grid -->
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically loaded items will appear here -->
    </div>
  </main>

  <footer class="py-6 bg-zinc-950 border-t border-zinc-900 text-center text-xs text-zinc-500">
    &copy; 2026 StoneSMP. All rights reserved.
  </footer>

  <script>
    function loadGallery() {
      const grid = document.getElementById('gallery-grid');
      const gallery = JSON.parse(localStorage.getItem('stonesmp_gallery') || '[]');

      if (gallery.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 glass-card rounded-2xl border border-zinc-800">
            <p class="text-zinc-400 text-sm">No images uploaded yet.</p>
            <p class="text-zinc-600 text-xs mt-1">Admins can upload images via the Admin Panel on the main page.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = '';
      gallery.forEach(item => {
        grid.innerHTML += `
          <div class="glass-card rounded-2xl overflow-hidden border border-zinc-800 group">
            <div class="h-48 bg-zinc-900 overflow-hidden relative">
              <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            </div>
            <div class="p-5">
              <h4 class="text-base font-bold text-white mb-1">${item.title}</h4>
              <p class="text-xs text-zinc-400">Uploaded by Admin</p>
            </div>
          </div>
        `;
      });
    }
    loadGallery();
  </script>
</body>
</html>
