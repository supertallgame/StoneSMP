<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoneSMP | Gallery</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/supabase.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], pixel: ['"Press Start 2P"', 'cursive'] }
        }
      }
    }
  </script>

  <style>
    body { background-color: #09090b; }
    .glass-card { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border: 2px solid rgba(234, 179, 8, 0.5); transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <header class="sticky top-0 z-40 backdrop-blur-md bg-zinc-950/90 border-b-2 border-brand-500/40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-12 h-12 flex items-center justify-center shrink-0">
          <img src="favicon.ico" onerror="this.onerror=null; this.src='logo.png'" alt="StoneSMP Icon" class="w-full h-full object-contain rounded-xl shadow-md">
        </div>
        <div>
          <span class="font-pixel text-sm sm:text-base text-zinc-100 tracking-wider block">STONE<span class="text-brand-400">SMP</span></span>
          <span class="text-[10px] text-zinc-400 font-bold tracking-widest uppercase block">Season 2 • Lifesteal</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-bold text-zinc-300">
        <a href="index.html#info" class="hover:text-brand-400 transition">Server Info</a>
        <a href="index.html#commands" class="hover:text-brand-400 transition">Commands</a>
        <a href="index.html#rules" class="hover:text-brand-400 transition">Rules</a>
        <a href="gallery.html" class="text-brand-400 transition">Gallery</a>
        <a href="schematics.html" class="hover:text-brand-400 transition">Schematics</a>
        <a href="index.html#vote" class="hover:text-brand-400 transition">Vote</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="https://discord.gg/mt4ny7vZB" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md">Discord</a>
        <a href="admin.html" class="inline-flex items-center gap-2 bg-brand-500 hover:bg-brand-400 text-zinc-950 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md">Admin Portal</a>
      </div>
    </div>
  </header>

  <main class="py-16 max-w-6xl mx-auto px-4 sm:px-6 w-full flex-1">
    <div class="text-center mb-16">
      <h1 class="font-pixel text-3xl sm:text-5xl text-white mb-3">SERVER <span class="text-brand-400">GALLERY</span></h1>
      <p class="text-sm text-zinc-400 font-medium">Explore screenshots of epic bases, builds, and fights from StoneSMP.</p>
    </div>

    <div id="gallery-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-20 text-zinc-400 text-sm font-medium" id="loading-msg">
        Loading gallery images...
      </div>
    </div>
  </main>

  <footer class="py-10 bg-zinc-950 border-t-2 border-brand-500/30 text-zinc-400 text-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
      <span class="font-pixel text-xs text-white">STONE<span class="text-brand-400">SMP</span> © 2026</span>
      <div class="flex items-center gap-6">
        <a href="index.html" class="hover:text-white transition font-bold">Home</a>
        <a href="schematics.html" class="hover:text-white transition font-bold">Schematics</a>
        <a href="admin.html" class="hover:text-white transition font-bold">Admin Portal</a>
      </div>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = 'https://pmyxbrlpgocibwsintoq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteXhicmxwZ29jaWJ3c2ludG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNjM3ODYsImV4cCI6MjEwODYzOTc4Nn0.54Dtt8oy8RXHxI2bFXdAvjmt2VDMB8AA_oFcQEarqoo';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    async function loadGallery() {
      const container = document.getElementById('gallery-container');
      const loadingMsg = document.getElementById('loading-msg');

      try {
        const { data, error } = await supabaseClient
          .from('files')
          .select('*')
          .eq('type', 'gallery')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          loadingMsg.innerText = 'No gallery images uploaded yet.';
          return;
        }

        container.innerHTML = '';
        data.forEach(file => {
          const card = document.createElement('div');
          card.className = 'glass-card rounded-3xl overflow-hidden shadow-xl flex flex-col';
          card.innerHTML = `
            <div class="h-48 overflow-hidden bg-zinc-900">
              <img src="${file.url}" alt="${file.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
            </div>
            <div class="p-5 flex flex-col justify-between flex-1 space-y-2">
              <h3 class="text-base font-bold text-white">${file.name}</h3>
              <p class="text-xs text-zinc-400">${file.description || ''}</p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading gallery:', err);
        loadingMsg.innerText = 'Failed to load gallery images from cloud storage.';
      }
    }

    loadGallery();
  </script>

</body>
</html>
