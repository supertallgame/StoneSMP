<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | StoneSMP Season 2</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              100: '#fef9c3',
              400: '#facc15',
              500: '#eab308',
              600: '#ca8a04',
              700: '#a16207',
            },
            bee: {
              chiffon: '#FFFACD',
              card: '#FEF08A',
              darkText: '#1C1917',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            pixel: ['"Press Start 2P"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #FFFACD; }
    .glass-card { background: rgba(254, 240, 138, 0.75); backdrop-filter: blur(12px); border: 2px solid rgba(234, 179, 8, 0.4); }
    .glass-card:hover { border-color: rgba(161, 98, 7, 0.8); }
    .bg-grid-pattern { background-image: radial-gradient(rgba(161, 98, 7, 0.2) 1.5px, transparent 1.5px); background-size: 24px 24px; }
  </style>
</head>
<body class="bg-bee-chiffon text-bee-darkText font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-bee-chiffon/90 border-b-2 border-brand-400">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-12 h-12 flex items-center justify-center shrink-0">
          <img src="favicon.ico" onerror="this.onerror=null; this.src='logo.png'" alt="StoneSMP Icon" class="w-full h-full object-contain rounded-xl shadow-md">
        </div>
        <div>
          <span class="font-pixel text-sm sm:text-base text-stone-900 tracking-wider block">STONE<span class="text-brand-600">SMP</span></span>
          <span class="text-[10px] text-stone-700 font-bold tracking-widest uppercase block">Season 2 • Lifesteal</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-bold text-stone-800">
        <a href="index.html#info" class="hover:text-brand-700 transition">Server Info</a>
        <a href="index.html#commands" class="hover:text-brand-700 transition">Commands</a>
        <a href="index.html#rules" class="hover:text-brand-700 transition">Rules</a>
        <a href="gallery.html" class="hover:text-brand-700 transition text-brand-700 font-extrabold">Gallery</a>
        <a href="index.html#vote" class="hover:text-brand-700 transition">Vote</a>
      </nav>

      <a href="admin.html" class="hidden sm:inline-flex items-center gap-2 bg-brand-500 hover:bg-brand-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md">
        Admin Portal
      </a>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="py-12 bg-grid-pattern border-b-2 border-brand-400">
    <div class="max-w-5xl mx-auto px-4 text-center">
      <h1 class="font-pixel text-3xl sm:text-5xl text-stone-900 tracking-tight mb-4">
        SERVER <span class="text-brand-600">GALLERY</span>
      </h1>
      <p class="text-sm sm:text-base text-stone-800 font-medium max-w-xl mx-auto">
        Snapshots, community builds, and epic combat moments from StoneSMP Season 2.
      </p>
    </div>
  </section>

  <!-- Gallery Grid -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-12 flex-1 w-full">
    <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Dynamically rendered -->
    </div>
  </main>

  <!-- Image Lightbox Modal -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-md flex items-center justify-center p-4 hidden" onclick="closeLightbox()">
    <div class="relative max-w-4xl w-full" onclick="event.stopPropagation()">
      <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white hover:text-brand-400 font-bold text-sm">✕ Close</button>
      <img id="lightbox-img" src="" alt="Full View" class="w-full h-auto max-h-[80vh] object-contain rounded-2xl border-2 border-brand-400 shadow-2xl">
      <h3 id="lightbox-title" class="text-center text-white font-bold text-lg mt-4"></h3>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-auto py-8 bg-brand-100 border-t-2 border-brand-400 text-stone-700 text-xs">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <span class="font-pixel text-xs text-stone-900">STONE<span class="text-brand-600">SMP</span></span>
      <a href="admin.html" class="text-[10px] text-stone-700 hover:text-stone-950 uppercase tracking-widest font-bold">Admin Portal</a>
    </div>
  </footer>

  <script>
    function renderGallery() {
      const grid = document.getElementById('gallery-grid');
      const customImages = JSON.parse(localStorage.getItem('stonesmp_gallery') || '[]');

      const defaultImages = [
        { title: 'Spawn Warzone', image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=800&q=80' },
        { title: 'End Crystal Battle', image: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=800&q=80' },
        { title: 'Community Village Base', image: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80' }
      ];

      const allImages = [...customImages, ...defaultImages];

      grid.innerHTML = allImages.map((item) => `
        <div onclick="openLightbox('${item.image}', '${item.title.replace(/'/g, "\\'")}')" class="glass-card rounded-2xl overflow-hidden group cursor-pointer border-2 border-brand-400 hover:border-brand-600 transition shadow-md">
          <div class="aspect-video w-full overflow-hidden bg-brand-200">
            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          </div>
          <div class="p-4 bg-brand-100/90">
            <h3 class="font-bold text-stone-900 text-sm truncate">${item.title}</h3>
            <span class="text-[10px] text-brand-700 font-bold uppercase tracking-wider block mt-1">StoneSMP Snapshot</span>
          </div>
        </div>
      `).join('');
    }

    function openLightbox(src, title) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-title').innerText = title;
      document.getElementById('lightbox-modal').classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
    }

    renderGallery();
  </script>
</body>
</html>
