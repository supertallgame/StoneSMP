<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoneSMP | Server Schematics</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load local bundled Supabase library first -->
  <script src="js/supabase.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' } },
          fontFamily: { sans: ['Inter', 'sans-serif'], pixel: ['"Press Start 2P"', 'cursive'] }
        }
      }
    }
  </script>

  <style>
    body { background-color: #09090b; }
    .glass-card { background: rgba(24, 24, 27, 0.85); backdrop-filter: blur(12px); border: 2px solid rgba(234, 179, 8, 0.5); transition: all 0.3s ease; }
    .glass-card:hover { border-color: rgba(234, 179, 8, 0.9); }
    .bg-grid-pattern { background-image: radial-gradient(rgba(234, 179, 8, 0.15) 1.5px, transparent 1.5px); background-size: 24px 24px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-40 backdrop-blur-md bg-zinc-950/90 border-b-2 border-brand-500/40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-12 h-12 flex items-center justify-center shrink-0">
          <img src="favicon.ico" onerror="this.onerror=null; this.src='logo.png'" alt="StoneSMP Icon" class="w-full h-full object-contain rounded-xl shadow-md">
        </div>
        <div>
          <span class="font-pixel text-sm sm:text-base text-zinc-100 tracking-wider block">STONE<span class="text-brand-400">SMP</span></span>
          <span class="text-[10px] text-zinc-400 font-bold tracking-widest uppercase block">Season 2 • Lifesteal</span>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-8 text-sm font-bold text-zinc-300">
        <a href="index.html#info" class="hover:text-brand-400 transition">Server Info</a>
        <a href="index.html#commands" class="hover:text-brand-400 transition">Commands</a>
        <a href="index.html#rules" class="hover:text-brand-400 transition">Rules</a>
        <a href="gallery.html" class="hover:text-brand-400 transition">Gallery</a>
        <a href="schematics.html" class="text-brand-400 transition">Schematics</a>
        <a href="index.html#vote" class="hover:text-brand-400 transition">Vote</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="https://discord.gg/mt4ny7vZB" target="_blank" rel="noopener noreferrer" class="hidden sm:inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md">Discord</a>
        <a href="admin.html" class="inline-flex items-center gap-2 bg-brand-500 hover:bg-brand-400 text-zinc-950 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md">Admin Portal</a>
      </div>
    </div>
  </header>

  <!-- Content Section -->
  <main class="py-16 max-w-6xl mx-auto px-4 sm:px-6 w-full flex-1">
    <div class="text-center mb-16">
      <h1 class="font-pixel text-3xl sm:text-5xl text-white mb-3">SERVER <span class="text-brand-400">SCHEMATICS</span></h1>
      <p class="text-sm text-zinc-400 font-medium">Download official WorldEdit / Litematica build schematics for StoneSMP Season 2.</p>
    </div>

    <!-- Schematics Grid Container -->
    <div id="schematics-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-20 text-zinc-400 text-sm font-medium" id="loading-msg">
        Loading cloud schematics...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-10 bg-zinc-950 border-t-2 border-brand-500/30 text-zinc-400 text-xs">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-6">
      <span class="font-pixel text-xs text-white">STONE<span class="text-brand-400">SMP</span> © 2026</span>
      <div class="flex items-center gap-6">
        <a href="index.html" class="hover:text-white transition font-bold">Home</a>
        <a href="gallery.html" class="hover:text-white transition font-bold">Gallery</a>
        <a href="admin.html" class="hover:text-white transition font-bold">Admin Portal</a>
      </div>
    </div>
  </footer>

  <script>
    // Corrected Supabase URL with the proper 's' in pmyxbrlpgocibwsintoq
    const SUPABASE_URL = 'https://pmyxbrlpgocibwsintoq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteXhicmxwZ29jaWJ3c2ludG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgxNDM2OTMsImV4cCI6MjA1MzcxOTY5M30.7_3P8iQ_M3f50S6zD0e8dJ-n-G9N6W3X3b9a5C9D0-E';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    async function loadSchematics() {
      const container = document.getElementById('schematics-container');
      const loadingMsg = document.getElementById('loading-msg');

      try {
        const { data, error } = await supabaseClient
          .from('files')
          .select('*')
          .eq('type', 'schematic')
          .order('id', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          loadingMsg.innerText = 'No schematics uploaded yet.';
          return;
        }

        container.innerHTML = '';
        data.forEach(file => {
          const card = document.createElement('div');
          card.className = 'glass-card p-6 rounded-3xl space-y-4 shadow-xl flex flex-col justify-between';
          card.innerHTML = `
            <div>
              <div class="w-12 h-12 bg-brand-500/10 border-2 border-brand-500 text-brand-400 rounded-2xl flex items-center justify-center font-bold text-xl mb-4 shadow">📦</div>
              <h3 class="text-base font-bold text-white mb-1">${file.name}</h3>
              <p class="text-xs text-zinc-400 font-medium">${file.description || 'Official server build schematic.'}</p>
            </div>
            <a href="${file.url}" target="_blank" download class="block text-center w-full bg-brand-500 hover:bg-brand-400 text-zinc-950 font-bold text-xs py-3 rounded-xl transition shadow-md">Download Schematic</a>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Error loading schematics:', err);
        loadingMsg.innerText = 'Failed to load schematics from cloud storage.';
      }
    }

    loadSchematics();
  </script>

</body>
</html>
