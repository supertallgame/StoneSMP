<script>
    const SUPABASE_URL = 'https://pmyxbrlpgocibwsintoq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBteXhicmxwZ29jaWJ3c2ludG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgxNDM2OTMsImV4cCI6MjA1MzcxOTY5M30.7_3P8iQ_M3f50S6zD0e8dJ-n-G9N6W3X3b9a5C9D0-E';
    
    // Explicitly disabling storage persistence to bypass browser tracking blocks
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    if (sessionStorage.getItem('admin_authenticated') === 'true') {
      showDashboard();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputPasscode = document.getElementById('passcode-input').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const loginBtn = document.getElementById('login-btn');

      errorMsg.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.innerText = 'Verifying...';

      try {
        const { data, error } = await supabaseClient
          .from('admin_config')
          .select('passcode')
          .eq('passcode', inputPasscode)
          .single();

        if (error || !data) {
          errorMsg.innerText = 'Invalid Admin Passcode';
          errorMsg.classList.remove('hidden');
        } else {
          sessionStorage.setItem('admin_authenticated', 'true');
          showDashboard();
        }
      } catch (err) {
        errorMsg.innerText = 'Authentication error. Please try again.';
        errorMsg.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'Verify Passcode';
      }
    });

    function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('admin_authenticated');
      window.location.reload();
    }
  </script>
